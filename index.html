    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chapter 6 JQuery</title>

    <!-- Link for CSS styles -->
    <link rel="stylesheet" href="./styles/main.css" type="text/css" />

    <!-- JQuery Library -->

    <!-- =======================================
    Attempt to load LOCAL jQuery first
    ======================================= -->
    <script src="./resources/jquery.min.js"></script>

    <!-- =======================================
    Fallback to CDN if local copy fails
    ======================================= -->
    <script>
        if (typeof jQuery === "undefined") {

            console.log("Local jQuery failed. Loading CDN version.");

            document.write(
                '<script src="https://code.jquery.com/jquery-3.7.1.min.js"><\/script>'
            );

        } else {

            console.log("Local jQuery loaded successfully.");

        }
    </script>

    <!-- Custom script -->
    <script src="scripts/main.js"></script>

</head>

<body>

    <header>

        <h1>jQuery Interactive Demo Site</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main>

        <section>

            <h2>DOM Manipulation Exercise</h2>

            <p id="introText">
                This paragraph will be modified using jQuery.
            </p>

            <button id="changeTextBtn">Change Text</button>
            <button id="hideTextBtn">Hide Text</button>
            <button id="showTextBtn">Show Text</button>

        </section>

        <section>

            <h2>Interactive Elements Exercise</h2>

            <div class="color-box" id="box1">Hover Me</div>

        </section>

        <section>

            <h2>Animation Exercise</h2>

            <button id="animateBtn">Animate Box</button>

            <div id="animateBox"></div>

        </section>

    </main>

    <footer>

        <p>&copy; Michael Barnes 2026</p>

    </footer>

</body>

</html>
